name: Linux AppImage

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  build-appimage:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            libglfw3-dev \
            libopenal-dev \
            libx11-dev \
            libxcursor-dev \
            libxinerama-dev \
            libxi-dev \
            libxrandr-dev \
            file \
            python3-pillow

      - name: Build raylib 6.x
        run: |
          git clone --depth 1 --branch 6.0.0 https://github.com/raysan5/raylib.git raylib-src
          cmake -S raylib-src -B raylib-build \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build raylib-build --parallel
          sudo cmake --install raylib-build

      - name: Configure game
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build game
        run: cmake --build build --parallel

      - name: Build AppImage
        run: |
          ./scripts/build-appimage.sh

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: Dungeon-Hunter-AppImage
          path: Dungeon-Hunter-x86_64.AppImage
