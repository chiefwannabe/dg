name: Linux AppImage

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  build-appimage:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            libglfw3-dev \
            libopenal-dev \
            libx11-dev \
            libxcursor-dev \
            libxinerama-dev \
            libxi-dev \
            libxrandr-dev \
            file \
            python3-pillow

      - name: Build raylib 6.x
        run: |
          git clone --depth 1 --branch 6.0.0 https://github.com/raysan5/raylib.git raylib-src
          cmake -S raylib-src -B raylib-build \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build raylib-build --parallel
          sudo cmake --install raylib-build

      - name: Configure game
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build game
        run: cmake --build build --parallel

      - name: Create AppDir
        run: |
          mkdir -p AppDir/usr/bin
          cp build/dungeon-hunter AppDir/usr/bin/dungeon-hunter

          cat > AppDir/dungeon-hunter.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Dungeon Hunter
          Exec=dungeon-hunter
          Icon=dungeon-hunter
          Categories=Game;
          EOF

          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          python3 -c "from PIL import Image, ImageDraw; img = Image.new('RGB', (256, 256), color = (16, 16, 22)); d = ImageDraw.Draw(img); d.text((20,120), 'DH', fill=(255,255,255)); img.save('AppDir/dungeon-hunter.png'); img.save('AppDir/usr/share/icons/hicolor/256x256/apps/dungeon-hunter.png')" || touch AppDir/dungeon-hunter.png

          cp AppDir/dungeon-hunter.png AppDir/.DirIcon 2>/dev/null || true

      - name: Build AppImage
        run: |
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ./appimagetool-x86_64.AppImage --appimage-extract
          ./squashfs-root/AppRun AppDir Dungeon-Hunter-x86_64.AppImage

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: Dungeon-Hunter-AppImage
          path: Dungeon-Hunter-x86_64.AppImage
